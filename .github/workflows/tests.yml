name: tests
on:
  push:
  pull_request:
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: System libraries (software OpenGL, ffmpeg, pdftoppm for the PDF export test)
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1-mesa-dri ffmpeg poppler-utils
      - name: Python dependencies
        run: pip install -r requirements.txt pytest pypdf
      - name: Tests
        env:
          FUNK_GL_BACKEND: egl
        run: |
          set -o pipefail
          pytest -q -rfE 2>&1 | tee pytest.txt || {
            grep -E "^(FAILED|ERROR) " pytest.txt | head -30 | sed 's/^/::error title=pytest::/'
            exit 1
          }

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ruff (version pinned in pyproject.toml, so the formatter output is stable)
        run: pip install ruff==0.17.3
      - name: Lint
        run: ruff check .
      - name: Format
        run: ruff format --check .