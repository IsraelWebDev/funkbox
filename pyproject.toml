[project]
name = "funkbox"
version = "4.1.0"
description = "Local GPU-shader funk loops, video ad reels and MCP servers for Claude. No cloud, no accounts."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pillow>=10.1",
  "imageio-ffmpeg>=0.5",
  "mcp>=1.2",
  "moderngl>=5.10",
  "fonttools>=4.40",
  "uharfbuzz>=0.39",
  "reportlab>=4.0",
]

[project.optional-dependencies]
reel = [
  "onnxruntime>=1.17",
  "kokoro-onnx>=0.4",
  "piper-tts>=1.2",
]
dev = [
  "pytest",
  "pypdf",
]

[project.scripts]
funkbox = "funkbox.cli:main"

[tool.uv]
package = false

[tool.pytest.ini_options]
# only our tests: vendor/ holds cloned third-party repos (gimp-mcp, FastSD) whose own test files
# must never be collected (gimp-mcp's call argparse at import time and abort the whole run)
testpaths = ["tests"]
norecursedirs = ["vendor", "out", "projects", "inbox", "inputs", "models", ".venv", ".git", "node_modules"]
