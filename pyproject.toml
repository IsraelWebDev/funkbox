[project]
name = "funkbox"
version = "3.1.0"
description = "Local GPU-shader funk loops, video ad reels and MCP servers for Claude. No cloud, no accounts."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pillow>=10.1",
  "imageio-ffmpeg>=0.5",
  "mcp>=1.2",
  "moderngl>=5.10",
]

[project.optional-dependencies]
reel = [
  "onnxruntime>=1.17",
  "piper-tts>=1.2",
]
dev = [
  "pytest",
]

[tool.uv]
package = false
